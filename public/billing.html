<!DOCTYPE html>
<html>
<head>
  <title>Billing</title>
  <link rel="stylesheet" href="billing.css">
</head>
<body>

<h2>Create Bill</h2>

<input id="phone" placeholder="Customer Phone">
<input id="item" placeholder="Item Name">
<input id="qty" type="number" placeholder="Quantity">
<input id="rate" type="number" placeholder="Rate">
<input id="paid" type="number" placeholder="Paid Amount">

<p>Total: <span id="total">0</span></p>

<button onclick="createBill()">Generate Bill</button>

<script>
const API = window.location.origin;

function calculate() {
  const q = document.getElementById("qty").value || 0;
  const r = document.getElementById("rate").value || 0;
  document.getElementById("total").innerText = q * r;
}

document.getElementById("qty").oninput = calculate;
document.getElementById("rate").oninput = calculate;

async function createBill() {
  const phone = document.getElementById("phone").value;
  const item = document.getElementById("item").value;
  const quantity = document.getElementById("qty").value;
  const rate = document.getElementById("rate").value;
  const paid = document.getElementById("paid").value || 0;

  const res = await fetch(`${API}/bill`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      phone,
      item_name: item,
      quantity,
      rate,
      paid
    })
  });

  const data = await res.json();

  if (res.ok) {
    window.open(
  `/invoice.html?name=${data.customer_name}&phone=${data.phone}&bill_no=${data.bill_no}&item=${data.item_name}&qty=${data.quantity}&rate=${data.rate}&total=${data.total}&paid=${data.paid}&remaining=${data.remaining}`
);
  } else {
    alert(data.error);
  }
}
</script>

</body>
</html>
