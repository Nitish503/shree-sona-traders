<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Billing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="billing.css">
</head>

<body>

<div class="container">

  <!-- ===================== -->
  <!-- CREATE BILL -->
  <!-- ===================== -->
  <h2>Create Bill</h2>

  <div class="top-inputs">
    <input id="phone" placeholder="Customer Phone">

    <!-- ✅ UPDATED SECTION (PAID + METHOD) -->
    <div style="display:flex; gap:10px; width:100%;">
      <input id="paid" type="number" placeholder="Paid Amount" style="flex:2;">

      <select id="paymentMethod" style="flex:1;">
        <option value="Cash">Cash</option>
        <option value="UPI">UPI</option>
        <option value="Bank">Bank</option>
        <option value="Card">Card</option>
      </select>
    </div>
  </div>

  <!-- ITEMS -->
  <table>
    <thead>
      <tr>
        <th>Item</th>
        <th>Qty</th>
        <th>Unit</th>
        <th>Rate</th>
        <th>Total</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="itemsTable"></tbody>
  </table>

  <button onclick="addRow()" class="btn add">+ Add Item</button>

  <h3>Total: ₹ <span id="total">0</span></h3>

  <button onclick="createBill()" class="btn primary">Generate Bill</button>


  <!-- ===================== -->
  <!-- SEARCH FILTER -->
  <!-- ===================== -->
  <div class="filters">
    <input id="searchInput" placeholder="Search name or phone" oninput="applyFilters()">

    <select id="statusFilter" onchange="applyFilters()">
      <option value="all">All</option>
      <option value="pending">Pending</option>
      <option value="completed">Completed</option>
    </select>

    <input type="date" id="dateFilter" onchange="applyFilters()">
  </div>


  <!-- ===================== -->
  <!-- PENDING -->
  <!-- ===================== -->
  <h2 class="section-title pending">🟡 Pending Payments</h2>
  <div id="pendingList" class="cards"></div>


  <!-- ===================== -->
  <!-- COMPLETED -->
  <!-- ===================== -->
  <h2 class="section-title completed">🟢 Completed Payments</h2>
  <div id="completedList" class="cards"></div>

</div>

<!-- ===================== -->
<!-- HISTORY / LEDGER MODAL -->
<!-- ===================== -->
<div id="historyModal" class="modal">
  <div class="modal-content">
    <span onclick="closeHistory()" style="float:right;cursor:pointer">❌</span>
    <div id="historyModalContent"></div>
  </div>
</div>

<script src="/billing.js"></script>

</body>
</html>
