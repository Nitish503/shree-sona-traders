<h2>Billing Records</h2>
<div id="billContainer"></div>
<script>
const API = "https://shree-sona-traders.onrender.com";

async function loadBills() {
  try {
    const res = await fetch(`${API}/bills`);

    if (!res.ok) {
      throw new Error("Failed to load bills");
    }

    const data = await res.json();

    const container = document.getElementById("billContainer");
    container.innerHTML = "";

    data.forEach(b => {
      const div = document.createElement("div");

      let itemsHTML = "";

      if (Array.isArray(b.items)) {
        itemsHTML = b.items.map(item => `
          <p>
            <strong>${item.name}</strong>
            | Qty: ${item.quantity}
            | Rate: ₹${item.rate}
            | Unit: ${item.unit}
          </p>
        `).join("");
      }

      div.innerHTML = `
        <h3>${b.customer_name}</h3>

        <p><strong>Phone:</strong> ${b.phone}</p>

        <p><strong>Items:</strong></p>
        ${itemsHTML}

        <p><strong>Total:</strong> ₹${b.total}</p>
        <p><strong>Paid:</strong> ₹${b.paid}</p>
        <p><strong>Remaining:</strong> ₹${b.remaining}</p>
        <p><strong>Status:</strong> ${b.status}</p>
        <p><strong>Bill No:</strong> ${b.bill_no}</p>

        ${b.status === "pending" ? `
          <input type="number" id="pay${b.id}" placeholder="Pay amount">
          <button onclick="pay(${b.id})">Pay</button>
        ` : ""}
      `;

      container.appendChild(div);
    });

  } catch (error) {
    console.error("Error loading bills:", error);

    document.getElementById("billContainer").innerHTML =
      "<p>Unable to load bills. Please try again.</p>";
  }
}

async function pay(id) {
  const amount = document.getElementById("pay" + id).value;

  if (!amount || Number(amount) <= 0) {
    alert("Enter a valid payment amount");
    return;
  }

  await fetch(`${API}/bills/${id}/pay`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      amount: Number(amount)
    })
  });

  alert("Payment updated");
  loadBills();
}

loadBills();
</script>
