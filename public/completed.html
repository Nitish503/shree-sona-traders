<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Completed Payments</title>
  <link rel="stylesheet" href="completed.css">
</head>
<body>

<h2>✅ Completed Payments</h2>

<div id="done"></div>

<script>
const API = window.location.origin;

async function loadCompleted() {
  try {
    const res = await fetch(`${API}/bills/completed`);

    if (!res.ok) {
      const err = await res.json();
      alert(err.error || "Error loading completed payments");
      return;
    }

    const data = await res.json();

    const div = document.getElementById("done");
    div.innerHTML = "";

    if (data.length === 0) {
      div.innerHTML = "<p style='text-align:center;'>No completed payments</p>";
      return;
    }

    data.forEach(b => {
      div.innerHTML += `
        <div class="card">
          <h3>${b.customer_name || "Customer"}</h3>
          <p><b>Phone:</b> ${b.phone}</p>
          <p><b>Total:</b> ₹${b.total}</p>
          <p><b>Paid:</b> ₹${b.paid}</p>
          <p><b>Date:</b> ${new Date(b.created_at).toLocaleString()}</p>
          <span class="paid">PAID</span>
        </div>
      `;
    });

  } catch (err) {
    console.error(err);
    alert("❌ Network error");
  }
}

loadCompleted();
</script>

</body>
</html>
