<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title> Fuel Services</title>
  <link rel="stylesheet" href="/services.css">
</head>
<body>

<h1> Fuels </h1>

<div id="itemsContainer" class="grid"></div>

<script>
function formatRupee(value) {
  return new Intl.NumberFormat('en-IN', {
    style: 'currency',
    currency: 'INR'
  }).format(value || 0);
}

async function loadItems() {
  const res = await fetch("/items/fuel");
  const data = await res.json();

  const container = document.getElementById("itemsContainer");
  container.innerHTML = "";

  data.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      ${item.image ? `<img src="${item.image}">` : ""}
      <h3>${item.name}</h3>
      <p>${item.description || "No description"}</p>

      <p class="price">${formatRupee(item.rate)}</p>

      <button onclick="openOrderForm(${item.id}, '${item.name}')">
  Order Now
</button>

      <span class="${item.status}">${item.status}</span>
    `;

    container.appendChild(card);
  });
}

loadItems();

let selectedItemId = null;
let selectedItemName = "";

// OPEN FORM
function openOrderForm(id, name) {
  selectedItemId = id;
  selectedItemName = name;
  document.getElementById("orderModal").style.display = "block";
}

// CLOSE FORM
function closeOrderForm() {
  document.getElementById("orderModal").style.display = "none";
}

// SUBMIT ORDER
async function submitOrder() {
  const name = document.getElementById("custName").value;
  const address = document.getElementById("custAddress").value;
  const phone = document.getElementById("custPhone").value;

  if (!name || !address || !phone) {
    alert("Fill all details");
    return;
  }

  await fetch("/order", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      item_id: selectedItemId,
      item_name: selectedItemName,
      customer_name: name,
      address: address,
      phone: phone
    })
  });

  alert("✅ Order placed!");

  closeOrderForm();

  // clear form
  document.getElementById("custName").value = "";
  document.getElementById("custAddress").value = "";
  document.getElementById("custPhone").value = "";
}
</script>

<!-- ORDER MODAL -->
<div id="orderModal" class="modal">
  <div class="modal-content">
    <h2>Place Order</h2>

    <input type="text" id="custName" placeholder="Your Name">
    <input type="text" id="custAddress" placeholder="Address">
    <input type="text" id="custPhone" placeholder="Phone Number">

    <button onclick="submitOrder()">Submit</button>
    <button onclick="closeOrderForm()">Cancel</button>
  </div>
</div>

</body>
</html>
