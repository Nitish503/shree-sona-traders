<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fuel Services</title>
  <link rel="stylesheet" href="/services.css">
</head>
<body>

<h1>Fuel Services</h1>

<div id="itemsContainer" class="grid"></div>

<script>
const API = window.location.origin;

function formatRupee(value) {
  return new Intl.NumberFormat('en-IN', {
    style: 'currency',
    currency: 'INR'
  }).format(value || 0);
}

// LOAD ITEMS
async function loadItems() {
  const res = await fetch(`${API}/items/fuel`);
  const data = await res.json();

  const container = document.getElementById("itemsContainer");
  container.innerHTML = "";

  data.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      ${item.image ? `<img src="${item.image}">` : ""}
      <h3>${item.name}</h3>
      <p>${item.description || "No description"}</p>
      <p class="price">${formatRupee(item.rate)}</p>

      <button onclick="openOrderForm(${item.id}, '${item.name}')">
        Order Now
      </button>

      <span class="${item.status}">${item.status}</span>
    `;

    container.appendChild(card);
  });
}

loadItems();

let selectedItemId = null;
let selectedItemName = "";

// OPEN FORM
function openOrderForm(id, name) {
  selectedItemId = id;
  selectedItemName = name;
  document.getElementById("orderModal").style.display = "block";
}

// CLOSE FORM
function closeOrderForm() {
  document.getElementById("orderModal").style.display = "none";
}

// SUBMIT ORDER
async function submitOrder() {
  const name = document.getElementById("custName").value;
  const phone = document.getElementById("custPhone").value;
  const permanent_address = document.getElementById("permAddress").value;
  const delivery_address = document.getElementById("delAddress").value;
  const quantity = document.getElementById("quantity").value;
  const unit = document.getElementById("unit").value;

  if (!name || !phone || !permanent_address || !delivery_address || !quantity || !unit) {
    alert("Fill all details");
    return;
  }

  try {
    const res = await fetch(`${API}/order`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        item_id: selectedItemId,
        phone,
        permanent_address,
        delivery_address,
        quantity,
        unit
      })
    });

    if (!res.ok) {
      const error = await res.text();
      alert("❌ Error: " + error);
      return;
    }

    alert("✅ Order placed successfully!");
    closeOrderForm();

  } catch (err) {
    alert("❌ Network Error");
  }
}
</script>

<!-- ORDER MODAL -->
<div id="orderModal" class="modal">
  <div class="modal-content">
    <h2>Place Order</h2>

    <input type="text" id="custName" placeholder="Your Name">
    <input type="text" id="custPhone" placeholder="Phone Number">

    <textarea id="permAddress" placeholder="Permanent Address"></textarea>
    <textarea id="delAddress" placeholder="Delivery Address"></textarea>

    <input type="number" id="quantity" placeholder="Quantity">
    <input type="text" id="unit" placeholder="Unit (kg, ton, litre, etc)">

    <button onclick="submitOrder()">Submit</button>
    <button onclick="closeOrderForm()">Cancel</button>
  </div>
</div>

</body>
</html>
