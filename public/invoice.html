<!DOCTYPE html>
<html>
<head>
  <title>Invoice</title>
  <link rel="stylesheet" href="invoice.css">
</head>
<body>

<div class="invoice">

  <!-- HEADER -->
  <div class="header">
    <h1>SHREE SONA TRADERS</h1>
    <p>Construction | Rental | Fuel Services</p>
  </div>

  <!-- INFO -->
  <div class="info">
    <div class="left">
      <p><b>Customer:</b> <span id="custName"></span></p>
      <p><b>Phone:</b> <span id="custPhone"></span></p>
    </div>

    <div class="right">
      <p><b>Invoice No:</b> <span id="billNo"></span></p>
      <p><b>Date:</b> <span id="billDate"></span></p>
    </div>
  </div>

  <!-- TABLE -->
  <table>
    <thead>
      <tr>
        <th>Sl</th>
        <th>Description</th>
        <th>Qty</th>
        <th>Rate</th>
        <th>Total</th>
      </tr>
    </thead>

    <tbody id="tableBody"></tbody>
  </table>

  <!-- SUMMARY -->
  <div class="summary">
    <div class="box">
      <p>Total: ₹<span id="total"></span></p>
      <p>Paid: ₹<span id="paid"></span></p>
      <p>Remaining: ₹<span id="remaining"></span></p>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <p>Authorized Signature</p>
  </div>

</div>

<div class="btns">
  <button onclick="printInvoice()">🖨 Print</button>
</div>

<!-- JS FILE -->
<script src="invoice.js"></script>

</body>
</html>
