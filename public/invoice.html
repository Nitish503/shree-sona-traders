<!DOCTYPE html>
<html>
<head>
  <title>Invoice</title>
  <link rel="stylesheet" href="invoice.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div class="invoice">

  <!-- HEADER -->
  <div class="header">
    <h1>SHREE SONA TRADERS</h1>
    <p>Construction | Rental | Fuel Services</p>

    <!-- 🔥 DYNAMIC TITLE -->
    <h2 id="title">Invoice</h2>

    <!-- ✅ NEW (INSTALLMENT INFO) -->
    <p id="installmentInfo" style="font-weight:bold;"></p>
  </div>

  <!-- INFO -->
  <div class="info">
    <div class="left">
      <p><b>Customer:</b> <span id="custName"></span></p>
      <p><b>Phone:</b> <span id="custPhone"></span></p>

      <!-- ✅ NEW (PAYMENT METHOD) -->
      <p id="methodRow" style="display:none;">
        <b>Method:</b> <span id="method"></span>
      </p>
    </div>

    <div class="right">
      <p><b>Bill No:</b> <span id="billNo"></span></p>
      <p><b>Date:</b> <span id="billDate"></span></p>
    </div>
  </div>

  <!-- TABLE -->
  <table>
    <thead>
      <tr>
        <th>Sl</th>
        <th>Description</th>
        <th>Qty</th>
        <th>Rate</th>
        <th>Total</th>
      </tr>
    </thead>

    <tbody id="tableBody"></tbody>
  </table>

  <!-- SUMMARY -->
  <div class="summary">
    <div class="box">
      <p><b>Total:</b> ₹<span id="total"></span></p>
      <p><b>Paid:</b> ₹<span id="paid"></span></p>
      <p><b>Remaining:</b> ₹<span id="remaining"></span></p>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <p>Thank you for your business 🙏</p>
    <p>Authorized Signature</p>
  </div>

</div>

<!-- 🔥 BUTTONS -->
<div class="btns">
  <button onclick="printInvoice()">🖨 Print / Save PDF</button>
</div>

<!-- JS FILE -->
<script src="invoice.js"></script>

</body>
</html>
