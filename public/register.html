<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customer Registration - SONA TRADER</title>
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <h2>Customer Registration</h2>
  <form id="register-form">
    <label for="name">Full Name:</label>
    <input type="text" id="name" required><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" required><br><br>

    <label for="phone">Phone:</label>
    <input type="tel" id="phone" required><br><br>

    <label for="address">Address:</label>
    <input type="text" id="address" required><br><br>

    <button type="submit" class="btn">Register</button>
  </form>

  <!-- Success/Failure message -->
  <div id="register-message" class="hidden"></div>

  <div id="register-output" class="hidden">
    <p>Thank you for registering, <span id="customer-name"></span>!</p>
  </div>

  <a href="index.html" class="btn back-btn">Back to Home</a>

  <script src="register.js"></script>
</body>
</html>
