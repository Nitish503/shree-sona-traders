<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/register.css">
</head>
<body>

<div class="container">
  <h2>Customer Registration</h2>

  <input type="text" id="name" placeholder="Enter your name">
  <input type="text" id="phone" placeholder="Enter phone number">

  <!-- CAPTCHA BOX -->
  <div class="captcha-container">
    <div class="captcha-box" id="captchaText">----</div>
    <button type="button" onclick="loadCaptcha()" class="refresh-btn">↻</button>
  </div>

  <input type="text" id="captchaInput" placeholder="Enter CAPTCHA">

  <!-- LOADER -->
  <div id="loader" class="loader"></div>

  <button onclick="register()" id="registerBtn">Register</button>
</div>

<script>
const API = window.location.origin;
let captchaId = "";

// ======================
// LOAD CAPTCHA
// ======================
async function loadCaptcha() {
  try {
    const box = document.getElementById("captchaText");
    box.innerText = "Loading...";

    const res = await fetch(`${API}/captcha`);
    const data = await res.json();

    console.log("Captcha:", data); // debug

    captchaId = data.id;
    box.innerText = data.captcha;

  } catch (err) {
    console.error("Captcha error:", err);
    document.getElementById("captchaText").innerText = "Error";
  }
}

// Call on page load
loadCaptcha();

// ======================
// REGISTER FUNCTION
// ======================
async function register() {
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const captcha = document.getElementById("captchaInput").value.trim();

  const loader = document.getElementById("loader");
  const btn = document.getElementById("registerBtn");

  if (!name || !phone || !captcha) {
    alert("Please fill all fields");
    return;
  }

  // SHOW LOADER
  loader.style.display = "block";
  btn.disabled = true;
  btn.innerText = "Processing...";

  try {
    const res = await fetch(`${API}/register`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name,
        phone,
        captcha,
        captchaId
      })
    });

    const data = await res.json();

    // ✅ HANDLE RESPONSE PROPERLY
    if (data.message === "registered") {
      alert("✅ Registered successfully");

    } else if (data.message === "already_registered") {
      alert("⚠️ You are already registered");

    } else {
      alert(data.error || "Something went wrong");
    }

    // CLEAR INPUTS
    document.getElementById("name").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("captchaInput").value = "";

    // RELOAD CAPTCHA
    loadCaptcha();

  } catch (err) {
    console.error(err);
    alert("❌ Network error");
  }

  // HIDE LOADER
  loader.style.display = "none";
  btn.disabled = false;
  btn.innerText = "Register";
}
</script>

</body>
</html>
