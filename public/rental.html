<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rental Services</title>
  <link rel="stylesheet" href="rental.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">SHREE SONA TRADER</div>
    <div class="menu-toggle">&#9776;</div>
  </nav>

  <section class="hero">
    <h1>Rental Services</h1>
    <p>Browse available rental items below.</p>
  </section>

  <div id="rental-items" class="item-container"></div>

  <footer>
    © 2026 SONA TRADER. All rights reserved.
  </footer>

  <script>
    async function loadRental() {
      const res = await fetch("/items/rental");
      const items = await res.json();
      const container = document.getElementById("rental-items");
      container.innerHTML = "";

      items.forEach(item => {
        if (item.status === "available") {
          const div = document.createElement("div");
          div.className = "item-card";
          div.innerHTML = `<h4>${item.name}</h4><p>${item.description}</p>`;
          container.appendChild(div);
        }
      });
    }
    loadRental();
  </script>
</body>
</html>
